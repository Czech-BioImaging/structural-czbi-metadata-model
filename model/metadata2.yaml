# ProcessedSpecimen:
# - explicitni pojmenovani pripraveneho vzorku

Specimen:
- [ InternalIdentifier, =1 ]      -- optional ID v ramci tohoto recordu, umoznuje (jednoznacne) re-use Specimenu
- [ Identifier, >=0 ]             -- optional PID(s) za celek, za cely tento jeden record
- [ Title, <=1 ]
- [ AdditionalNote, >=0 ]
- [ Organism, =1 ]                -- main organism (aka reference frame)
- [ BiogenicEntity, <=1 ]         -- examined part of the organism (aka partOf)

BiogenicEntity:  (defacto to je nejaky mensi "dil" z Organism, ktery muze mit svuj dalsi mensi "dil"...)
                 (mohlo by to byt i jako Array v Specimen, ale porad kazdy item muze mit vice synonymnich nazvu BiogenicEntityType)
- [ BiogenicEntity, <=1 ]         -- partOf (umoznuje sestavit tzv. "zjemnujici retezec")
                                  -- v GUI je to v podstate tlacitko "Add another part"
- [ BiogenicEntityType, >=1 ]     -- popis teto entity, ktery realizovan pomoci typu BiogenicEntityType

BiogenicEntityType:
- [ BiogenicEntityOntology, =1 ] -- zvolena ontologie pojmenovani biologickych research predmetu
- [ BiogenicEntityLabel, =1 ]    -- hodnota z teto zvolene ontologie

Organism:
- [ AcceptedScientificName, >=0 ] -- spis volny string, typicke "hovorove" oznaceni
- [ TaxonRank, >=0 ]              -- ontologie, exaktni biologicke pojmenovani

