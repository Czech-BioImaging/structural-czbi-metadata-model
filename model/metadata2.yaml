...for concept model v0.3...

Resource is one of:
 - DigitalObject
 - BiogenicEntity
  (- MaterialEntity -- not now)
 - ProcessingStep


-------------------------
-------------------------

Identifier:
- [ IdentifierAuthorized, <=1 ]   ?? meaning of this ??
- [ IdentifierScheme, =1 ]   -- DOI, ePIC, atp.;
                             -- dovedu si predstavit i interni Invenio cislovani, tzn. Invenio ID;
                             -- nebo dokonce jenom localni cislovani v ramci jednoho Invenio recordu
- [ IdentifierValue, =1 ]    -- PID value itself


Metadata:                    -- entry point
- [ Identifier, >=0 ]        -- optional PID(s) za celek, za cely tento jeden record
- [ Title, <=1 ]
- [ AdditionalNote, >=0 ]
- [ ThisRecordItem, >=1 ]    -- array of sub-records that make up this record, muze pouzivat "localni cislovani v ramci jednoho Invenio recordu";
                                v podstate implicitni model
nebo
- [ DataCreatingProfile, >=1 ] -- array of Raw, Processed nebo Analysed;
                                  v podstate explicitni model
nebo
- OneOf: [ RawDataProfile, >= 1 ], [ ProcessedDataProfile, >= 1 ], [ AnalysedDataProfile, >= 1 ]
                               -- jedno ze tri moznych mono-typovych arrays, explicitni model

---
ThisRecordItem:
- [ LocalIdentifier, =1 ]    -- optional PID(s) za dilci sub-recordy
- OneOf: NonImageData, ImageData, ProcessingStep, ProcessedSpecimen
#
Note: NonImageData a ImageData jsou instanceOf DigitalObject
Note: DigitalObject jsou 's-daty' recordy, neco deponuji
Note: ProcessingStep a ProcessedSpecimen jsou 'bez-datove' recordy, metadata-only

ImageAnalysisStep a SamplePreparationStep umi produkovat NonImageData 
ImageAcquisitionStep a ImageProcessingStep a ImageAnalysisStep umi produkovat ImageData
---

DataCreatingProfile:
- [ LocalIdentifier, =1 ]    -- optional PID(s) za dilci sub-recordy
- OneOf: RawDataProfile, ProcessedDataProfile, AnalysedDataProfile

RawDataProfile:
- Specimen
- [ SamplePreparationStep ]
- ImageAcquisitionStep

ProcessedDataProfile:
- [ ImageProcessingStep ]

AnalysedDataProfile:
- [ ImageAnalysisStep ]


------------------------------------------------


ProcessingStep:
- [ LocalIdentifier, =1 ]    -- optional ID v ramci tohoto recordu, umoznuje (jednoznacne) re-use ProcessingStep
- [ Label, >=0 ]
- [ AdditionalNote, >=0 ]
- [ Method, >=1 ]
- [ Tool, >=1 ]
## !!! neni nutne, resi se to temi _arrays_ v DataCreatingProfile - [ ProcessingStep, <=1 ]     -- predchozi ProcessingStep
- OneOf: ImageAnalysisStep, ImageProcessingStep,
         ImageAcquisitionStep, SamplePreparationStep

Method:
- [ MethodLabel, >=0 ]       -- dedicated ontologies
- [ Description, >=0 ]

Tool:
- [ ToolLabel, >=0 ]         -- spis seznam tools dle typu ProcessingStep
- [ Description, >=0 ]


ImageAnalysisStep, ImageProcessingStep:
- Software tady nahrazuje Tool


SamplePreparationStep:
- TODO
# note: umoznuje "primichavat vzorky" tim, ze se do Description napise "primichano xyz"

ImageAcquisitionStep:
- TODO

ImageProcessingStep:
- TODO

ImageAnalysisStep:
- TODO


------------------------------------------------


# ProcessedSpecimen:
# - explicitni pojmenovani pripraveneho vzorku

Specimen:
- [ Organism, =1 ]                -- main organism (aka reference frame)
- [ BiogenicEntity, =1 ]          -- examined part of the organism

BiogenicEntity:
- [ BiogenicEntity, <=1 ]         -- partOf (umoznuje sestavit tzv. "zjemnujici retezec")
- [ BiogenicEntityType, <=1 ]     -- ontologie pojmenovani biologickych research predmetu

Organism:
- [ AcceptedScientificName, >=0 ] -- spis volny string, typicke "hovorove" oznaceni
- [ Taxon, =1 ]                   -- ontologie, exaktni biologicke pojmenovani
- [ TaxonRank, >=0 ]              -- docela urcite ontologie, ale nevim presne ceho!! VLADO TODO


SamplePreparationStep:
- [ Specimen, >=1 ]          -- input
- [ ProcessedSpecimen, >=1 ] -- output
- [ DigitalObject, >=0 ]     -- output


