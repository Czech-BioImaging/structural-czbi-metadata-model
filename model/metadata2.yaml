Identifier: (tento neni videt v GUI!)
- [ IdentifierAuthorized, <=1 ]  -- (bool) Specifies whether the identifier is authorized by the subject it represents
- [ IdentifierScheme, =1 ]   -- DOI, ePIC, atp.;
                             -- dovedu si predstavit i interni Invenio cislovani, tzn. Invenio ID;
                             -- nebo dokonce jenom localni cislovani v ramci jednoho Invenio recordu
- [ IdentifierValue, =1 ]    -- PID value itself


Metadata:                    -- entry point
- [ Identifier, >=0 ]        -- optional PID(s) za celek, za cely tento jeden record
- [ Title, <=1 ]
- [ AdditionalNote, >=0 ]
- OneOf: [ RawDataProfile, >= 1 ], [ ProcessedDataProfile, >= 1 ], [ AnalysedDataProfile, >= 1 ]
                               -- jedno ze tri moznych mono-typovych arrays, explicitni model
                               -- musi to ctit nemixovani profilu, tzn. record je 1+ items od stejneho profilu
                               -- Invenio bude potrebovat "mezityp" kvuli tem arrays

#keeping but not used# ---
#keeping but not used# ThisRecordItem:
#keeping but not used# - [ LocalIdentifier, =1 ]    -- optional PID(s) za dilci sub-recordy
#keeping but not used# - OneOf: NonImageData, ImageData, ProcessingStep, ProcessedSpecimen
#keeping but not used# #
#keeping but not used# Note: NonImageData a ImageData jsou instanceOf DigitalObject
#keeping but not used# Note: DigitalObject jsou 's-daty' recordy, neco deponuji
#keeping but not used# Note: ProcessingStep a ProcessedSpecimen jsou 'bez-datove' recordy, metadata-only
#keeping but not used# 
#keeping but not used# ImageAnalysisStep a SamplePreparationStep umi produkovat NonImageData 
#keeping but not used# ImageAcquisitionStep a ImageProcessingStep a ImageAnalysisStep umi produkovat ImageData
#keeping but not used# ---

RawDataProfile:
- [ Specimen, =1 ]
- [ SamplePreparationStep, >=0 ]
- [ ImageAcquisitionStep, =1 ]

ProcessedDataProfile:
- [ ImageProcessingStep, >=1 ]

AnalysedDataProfile:
- [ ImageAnalysisStep, >=1 ]


------------------------------------------------


ProcessingStep:
- [ InternalIdentifier, =1 ] -- optional ID v ramci tohoto recordu, umoznuje (jednoznacne) re-use ProcessingStep
- [ Label, >=0 ]
- [ AdditionalNote, >=0 ]
- [ Method, >=1 ]
- [ Tool, >=1 ]
- OneOf: ImageAnalysisStep, ImageProcessingStep,
         ImageAcquisitionStep, SamplePreparationStep

Method:  (pozor!, je to specializace Metadata resp. Resource)
- [ MethodLabel, <=1 ]       -- defacto prejmenovany Title z Metadata
- [ MethodType, >=0 ]        -- dedicated ontologies, podobne jako BiogenicEntityType
- [ Description, >=0 ]       -- defacto prejmenovany AdditionalNote z Metadata

MethodType:
- [ MethodOntology, =1 ]     -- zvolena ontologie pojmenovani metod
- [ MethodLabel, =1 ]        -- hodnota z teto zvolene ontologie

Tool:    (pozor!, je to specializace Metadata resp. Resource)
- [ ToolLabel, <=1 ]         -- defacto prejmenovany Title z Metadata
- [ Description, >=0 ]       -- defacto prejmenovany AdditionalNote z Metadata
- [ Identifier, >=0 ]        -- optional PID(s), dedictvi z Metadata resp. Resource


ImageAnalysisStep, ImageProcessingStep:
- Software tady nahrazuje Tool


SamplePreparationStep:
- TODO
# note: umoznuje "primichavat vzorky" tim, ze se do Description napise "primichano xyz"

ImageAcquisitionStep:
- TODO

ImageProcessingStep:
- TODO

ImageAnalysisStep:
- TODO


