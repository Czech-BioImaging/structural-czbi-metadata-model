...for concept model v1.0...

✅
Metadata:                         -- entry point
- [ RecordTitle, =1]              -- is coming from CCMM, basically; simulates what $Resource would do; OR, there should be one for each item in the profile array?
- [ AdditionalNote, >=0 ]         -- is coming from CCMM, basically; simulates what $Resource would do; OR, there should be one for each item in the profile array?
- [ PublicationYear: int, =1 ]    -- release year, not necessarily the same as the "DateInfo" in CCMM
- [ Version: float, <=1 ]         -- release version; allows for repetition and changes monitoring
- WasGeneratedBy, =1: OneOf [ RawDataProfile, >=1 ], [ ProcessedDataProfile, >=1 ],
                            [ AnalysedDataProfile, >=1 ], [ GeneralRecordProfile, =1 ]

------------------------------------------------

RawDataProfile:
- [ Specimen, =1 ]
- [ SamplePreparationStep, >=0 ]
- [ ImageAcquisitionStep, >=1 ]

ProcessedDataProfile:
- [ InputDataIRI, >=1 ]           -- explicit reference on input image data for this run by means of:
                                  -- preferably a PID-url to an external service (where are persistently reachable images)
                                  -- ref/PID-url to final/published record from this repo ('ref' means Invenio's qqqqq-wwwww internal record ID)
                                  -- ref to draft record from this repo ('ref' means Invenio's qqqqq-wwwww internal record ID)
- [ ImageProcessingStep, >=1 ]    -- no surprise: the steps were executed in the listed order
- [ ResultData: DigitalImageSink, >=1 ]   -- this is the *end*-result (Image(s) only) of the whole pipeline;
                                             note that the individual Steps are allowed to produce their own "intermediate" Digital*Sinks

AnalysedDataProfile:
- [ InputDataIRI, >=1 ]           -- explicit reference on input image data for this run by means of:
                                  -- preferably a PID-url to an external service (where are persistently reachable images)
                                  -- ref/PID-url to final/published record from this repo ('ref' means Invenio's qqqqq-wwwww internal record ID)
                                  -- ref to draft record from this repo ('ref' means Invenio's qqqqq-wwwww internal record ID)
- [ ImageProcessingStep, >=0 ]    -- no surprise: the steps were executed in the listed order
- [ ImageAnalysisStep, >=1 ]      -- no surprise: the steps were executed in the listed order
- [ ResultData: DigitalObjectSink, >=0 ]  -- the sum of numbers of DigitalObjectSink and DigitalImageSink instances must be >=1
- [ ResultData: DigitalImageSink, >=0 ]   -- this is the *end*-result (Object(s), Image(s), or a mixture of them) of the whole pipeline;
                                             note that the individual Steps are allowed to produce their own "intermediate" Digital*Sinks

GeneralRecordProfile:
- void/pass/noop                  -- nothing extra needs to be told; we're just CCMM metadata and RO-Crate data
                                  -- could possibly fit here Invenio.LinkedRecords but that uses CCMM, which is flat---cannot structure referenced items

------------------------------------------------
✅
Resource:                         -- will be used with '$' which denotes inheriting all items of the Resource
                                  -- Resource is expected to be associated with PID(s)
                                  -- it can be currently Specimen, ProcessingStep or Digital*Sink
- [ Title, <=1 ]                  -- title of this particular item, which is not a CCMM-wrapped full record
- [ AdditionalNote, >=0 ]
- [ InternalID, =1 ]              -- !optional! when reusing a $Resource in another Specimen or ProcessingStep (or in another
                                     derivate of a Resource), the $Resource is verbatim copied incl. InternalID (this allows
                                     to detect multiple usage of the same Resource), and setters of a Resource (Specimen, etc.)
                                     will also set a new unique InternalID with every change (which assures that the changed
                                     Resource will be understood as unique again)

OntologyTerm:
- [ OntologyName, =1 ]            -- common name under which the ontology is recognized
- [ OntologyVersion, =1 ]         -- at least could be a date on which the value has been taken...
- [ TermLabel, =1 ]               -- the actual value that is matched and displayed
- [ TermIRI, =1 ]                 -- PID-like reference to the definition of the TermLabel; ontology can be inferred from this as well
- [ TermIsDefinite, =1 ]          -- could be also named as isLeaf(); suggests if a finer term was available in the ontology

------------------------------------------------

Specimen:
# dle FIGMA:
#
# Taxon: spieces z NCBI (napr. modelove organismy), plati min spieces level vybirani, pohled vyvoje, =1
# Specimen is: Hepa cells -- strukturni pohled, napr. "srdce", =1
# Specimen part of: popisovani do vyssich urovni... >=0   (vycet moznych ontologii dle aktualniho obsahu ve Figme)
#    pokud Specimen_is je z ontologie (tzn. stromova struktura, tak se "part of" doplni cela cesta ke koreni;
#    pokud Specimen_is je z plocheho slovniku, listu, tak se "part of" nemuze doplnit automaticky a bude se doufat, ze to udela user
#
# a tyhle "Specimen is" a "Specimen part of" jsou v konceptualnim modelu "type" mezi BiogenicEntity a BiogenicEntityType
# jenze BiogenicEntityType je v podstate polozka z nejake ontologie
#
- $Resource                           -- title+addNote of the specimen
- [ IsPartOfOrganism: Organism, =1 ]  -- main organism (defined with a Taxon) from which the specimen is "derived"
- [ IsPartOf: OntologyTerm, >=1 ]     -- chain of labels (possibly taken from vocabularies) to incrementally refine
                                         the specification of the loci on the organism; an _ordered_ list from
                                         larger to smaller (being a subset) "components of the organism"; the first
                                         part on the list represents "Specimen is"; the second and further parts
                                         represent "Specimen part of"

Organism:
- [ BelongsTo: Taxon, =1 ]

Taxon:
- [ AcceptedScientificName: OntologyTerm, =1 ] -- taxonomie (ontologie), exaktni biologicke pojmenovani
                                      -- vybiraji z NCBI v nejnizsim vhodnem levelu/urovni/ranku; minimalne
                                         vsak z levelu/urovne/ranku Spieces
                                      -- level, ktery byl pouzit, se zapamatuje v atributu 'TaxonRank'
- [ TaxonRank: OntologyTerm =1 ]      -- It is a value of 'Taxonomic rank'@ncbi.nlm.nih.gov, 'RANK'@BioPortal, 'has_rank'@OLS
                                      -- !Redundant! The taxonomic rank of the most specific name in the dwc:scientificName;
                                         but this is a mandatory parameter available at IRI of 'AcceptedScientificName'...
                                      -- Associated ontology will be basically a set of accepted terms (Ranks) that CzBIRD
                                         will define for this purpose; currently it will contain a single term 'Species'

------------------------------------------------

SamplePreparationStep:
- $ProcessingStep
- [ DigitalObjectSink, >=0 ]      -- optional side-output of this particular step, e.g. room temperature measurements during specimen preparation

ImageAcquisitionStep:             -- "rebrands" (Processed)Specimen into a Sample, and connects it with its deposited images
- $ProcessingStep                 -- describes the "digitization" process
- [ DigitalImageSink, =1 ]        -- describes the deposited images

ImageProcessingStep:
- $ProcessingStep
- [ DigitalObjectSink, >=0 ]      -- optional side-output of this particular step, e.g. a log file of the computing, or debug image(s)
- [ DigitalImageSink, >=0 ]       -- optional side-output deposited images

ImageAnalysisStep:
- $ProcessingStep
- [ DigitalObjectSink, >=0 ]      -- optional side-output of this particular step, e.g. a log file of the computing, or debug image(s)
- [ DigitalImageSink, >=0 ]       -- optional side-output deposited images

------------------------------------------------
✅
DigitalObjectSink:                -- placeholder to make a connection between deposited "S3 folder" (piece of data) with _any_ files
                                  -- it shows www developers when to ask for files
                                  -- the path shall be set internally, including the Label
- $Resource                       -- !attention! Resource.Title is here replaced with DataLabel
- [ DataLabel: str, =1 ]          -- biologists like to tag/name their individual datasets (individual pieces from a bulk of data)
                                  -- if no tag is provided by the user, the system must jump-in and create unique one (unique within this record)
                                  -- tags/names can be auto-created e.g. as integer numbers
                                  -- the Label becomes unchangeable the moment upload starts
- [ DataPath: str, =1 ]           -- this path, obviously, works within the "S3 bucket" associated for this record, includes Label

DigitalImageSink:                 -- placeholder to make a connection between deposited "S3 folder" (piece of data) with _image_ files
- $Resource                       -- !attention! Resource.Title is here replaced with ImagesLabel
- [ ImagesLabel: str, =1 ]        -- same as for DigitalObjectSink; likely an "experiment label"
- [ ImagesPath: str, =1 ]         -- same as for DigitalObjectSink
- [ ImagesMetadataKVpairs: str, <=1 ] -- format "key1=value1;key2=value2;..." containing all (even proprietary) metadata
                                         from the uploaded image files
                                      -- suggested by PetrBartunek@UMG

------------------------------------------------

ProcessingStep:                       -- needs to be "instantiated" with per-step different lists of ontologies (one list for methods, one for tools)
- [ Label: str, =1 ]                  -- basically a user's nickname/tag for this step; at worst autogenerated by the UI (e.q. SP3, IA8)
- [ RealizesMethod: Method, =1 ]      -- ("realizes method"), methodology, kind of action taken, e.g. Convolution, Segmentation
- [ EmploysTool: Tool, =1 ]           -- ("has employed tool"), tool to realize the methodology or the action, e.g. Huygens, Cellpose

Method:
- $MethodsAndTools
- [ MethodTypeLabel: OntologyTerm, >=1 ]

Tool:
- $MethodsAndTools
- [ IsSoftware: boolean, =1 ]

MethodsAndTools:
- $Resource                           -- title+addNote of the specific tool
- [ DescriptionOrPID, >=0 ]           -- explains the tool, or outsources the description by providing a PID to the description

