# CzBIRD metadata model — NRP Invenio schema
# Converted from metadata.yaml (human-readable specification)
#
# Inheritance ($Resource, $ProcessingStep, $MethodsAndTools) is flattened into
# each concrete type since NRP has no inheritance mechanism.
#
# Naming: custom types use PascalCase with CZBIRD prefix; property names use snake_case.

# ---------------------------------------------------------------------------
# Leaf types (no dependencies on other CZBIRD types)
# ---------------------------------------------------------------------------

CZBIRDOntologyTerm:
  type: object
  properties:
    ontology_name:
      type: keyword
      required: true
    ontology_version:
      type: keyword
      required: true
    term_label:
      type: keyword
      required: true
    term_iri:
      type: keyword
      required: true
    term_is_definite:
      type: boolean
      required: true

CZBIRDDigitalObjectSink:
  # Resource.title is replaced here by data_label
  type: object
  properties:
    additional_note:
      # optional
      type: array
      items:
        type: fulltext
    internal_id:
      type: keyword
      required: true
    data_label:
      type: keyword
      required: true
    data_path:
      type: keyword
      required: true

CZBIRDDigitalImageSink:
  # Resource.title is replaced here by images_label
  type: object
  properties:
    additional_note:
      # optional
      type: array
      items:
        type: fulltext
    internal_id:
      type: keyword
      required: true
    images_label:
      type: keyword
      required: true
    images_path:
      type: keyword
      required: true
    images_metadata_kv_pairs:
      # optional
      # format: "key1=value1;key2=value2;..." — all metadata from uploaded image files
      type: keyword

# ---------------------------------------------------------------------------
# Biological identity chain: OntologyTerm → Taxon → Organism → Specimen
# ---------------------------------------------------------------------------

CZBIRDTaxon:
  type: object
  properties:
    accepted_scientific_name:
      type: CZBIRDOntologyTerm
      required: true
    taxon_rank:
      # redundant but mandatory; value comes from the IRI of accepted_scientific_name
      type: CZBIRDOntologyTerm
      required: true

CZBIRDOrganism:
  type: object
  properties:
    belongs_to:
      type: CZBIRDTaxon
      required: true

CZBIRDSpecimen:
  # Flattened from $Resource + Specimen-specific fields
  type: object
  properties:
    title:
      # optional
      type: fulltext+keyword
    additional_note:
      # optional
      type: array
      items:
        type: fulltext
    internal_id:
      type: keyword
      required: true
    is_part_of_organism:
      type: CZBIRDOrganism
      required: true
    is_part_of:
      # ordered list from largest to smallest component; first element = "Specimen is",
      # subsequent elements = "Specimen part of"
      type: array
      items:
        type: CZBIRDOntologyTerm
      min_items: 1
      required: true

# ---------------------------------------------------------------------------
# Method and Tool (both flatten $MethodsAndTools which flattens $Resource)
# OneOf [description] / [iri] constraint must be enforced by the UI layer.
# ---------------------------------------------------------------------------

CZBIRDMethod:
  type: object
  properties:
    title:
      # optional
      type: fulltext+keyword
    additional_note:
      # optional
      type: array
      items:
        type: fulltext
    internal_id:
      type: keyword
      required: true
    method_type_label:
      type: array
      items:
        type: CZBIRDOntologyTerm
      min_items: 1
      required: true
    protocolA_name:
      # items from exactly OneOf protocolA_ or protocolB_ must be provided
      type: fulltext
    protocolA_description:
      # items from exactly OneOf protocolA_ or protocolB_ must be provided
      type: fulltext
    protocolB_iri:
      # items from exactly OneOf protocolA_ or protocolB_ must be provided
      type: keyword

CZBIRDTool:
  type: object
  properties:
    title:
      # optional
      type: fulltext+keyword
    additional_note:
      # optional
      type: array
      items:
        type: fulltext
    internal_id:
      type: keyword
      required: true
    is_software:
      type: boolean
      required: true
    protocolA_name:
      # items from exactly OneOf protocolA_ or protocolB_ must be provided
      type: fulltext
    protocolA_description:
      # items from exactly OneOf protocolA_ or protocolB_ must be provided
      type: fulltext
    protocolB_iri:
      # items from exactly OneOf protocolA_ or protocolB_ must be provided
      type: keyword

# ---------------------------------------------------------------------------
# Processing steps (all flatten $ProcessingStep which has label/method/tool)
# ---------------------------------------------------------------------------

CZBIRDSamplePreparationStep:
  type: object
  properties:
    step_label:
      type: keyword
      required: true
    realizes_method:
      type: CZBIRDMethod
      required: true
    employs_tool:
      type: CZBIRDTool
      required: true
    digital_object_sink:
      # optional
      type: array
      items:
        type: CZBIRDDigitalObjectSink

CZBIRDImageAcquisitionStep:
  type: object
  properties:
    step_label:
      type: keyword
      required: true
    realizes_method:
      type: CZBIRDMethod
      required: true
    employs_tool:
      type: CZBIRDTool
      required: true
    digital_image_sink:
      type: CZBIRDDigitalImageSink
      required: true

CZBIRDImageProcessingStep:
  type: object
  properties:
    step_label:
      type: keyword
      required: true
    realizes_method:
      type: CZBIRDMethod
      required: true
    employs_tool:
      type: CZBIRDTool
      required: true
    digital_object_sink:
      type: array
      items:
        type: CZBIRDDigitalObjectSink
    digital_image_sink:
      type: array
      items:
        type: CZBIRDDigitalImageSink

CZBIRDImageAnalysisStep:
  type: object
  properties:
    step_label:
      type: keyword
      required: true
    realizes_method:
      type: CZBIRDMethod
      required: true
    employs_tool:
      type: CZBIRDTool
      required: true
    digital_object_sink:
      type: array
      items:
        type: CZBIRDDigitalObjectSink
    digital_image_sink:
      type: array
      items:
        type: CZBIRDDigitalImageSink

# ---------------------------------------------------------------------------
# Profile content types (the actual pipelines carried by each profile)
# ---------------------------------------------------------------------------

CZBIRDRawPipeline:
  type: object
  properties:
    specimen:
      type: CZBIRDSpecimen
      required: true
    sample_preparation_step:
      type: array
      items:
        type: CZBIRDSamplePreparationStep
    image_acquisition_step:
      type: array
      items:
        type: CZBIRDImageAcquisitionStep
      min_items: 1
      required: true

CZBIRDProcessedPipeline:
  type: object
  properties:
    input_data_iri:
      # PID-url or Invenio internal ref (qqqqq-wwwww) to input image data
      type: array
      items:
        type: keyword
      min_items: 1
      required: true
    image_processing_step:
      # steps listed in execution order
      type: array
      items:
        type: CZBIRDImageProcessingStep
      min_items: 1
      required: true
    result_data:
      # end-result images of the whole pipeline (intermediate outputs live in Steps)
      type: array
      items:
        type: CZBIRDDigitalImageSink
      min_items: 1
      required: true

CZBIRDAnalysedPipeline:
  type: object
  properties:
    input_data_iri:
      type: array
      items:
        type: keyword
      min_items: 1
      required: true
    image_processing_step:
      # optional pre-analysis processing; listed in execution order
      type: array
      items:
        type: CZBIRDImageProcessingStep
    image_analysis_step:
      # listed in execution order
      type: array
      items:
        type: CZBIRDImageAnalysisStep
      min_items: 1
      required: true
    result_data_objects:
      # end-result non-image outputs; result_data_objects + result_data_images combined >= 1
      type: array
      items:
        type: CZBIRDDigitalObjectSink
    result_data_images:
      # end-result image outputs; result_data_objects + result_data_images combined >= 1
      type: array
      items:
        type: CZBIRDDigitalImageSink

# ---------------------------------------------------------------------------
# Record profiles — discriminated via profile_type for the polymorphic field
# ---------------------------------------------------------------------------

CZBIRDRawDataProfile:
  type: object
  properties:
    profile_type:
      type: keyword
      required: true
    raw_data:
      type: array
      items:
        type: CZBIRDRawPipeline
      min_items: 1
      required: true

CZBIRDProcessedDataProfile:
  type: object
  properties:
    profile_type:
      type: keyword
      required: true
    processed_data:
      type: array
      items:
        type: CZBIRDProcessedPipeline
      min_items: 1
      required: true

CZBIRDAnalysedDataProfile:
  type: object
  properties:
    profile_type:
      type: keyword
      required: true
    analysed_data:
      type: array
      items:
        type: CZBIRDAnalysedPipeline
      min_items: 1
      required: true

CZBIRDGeneralRecordProfile:
  # No extra metadata beyond the top-level Metadata fields and CCMM/RO-Crate data
  type: object
  properties:
    profile_type:
      type: keyword
      required: true

# ---------------------------------------------------------------------------
# Root metadata blueprint
# ---------------------------------------------------------------------------

Metadata:
  properties:
    record_title:
      type: fulltext+keyword
      required: true
    additional_note:
      # optional
      type: array
      items:
        type: fulltext
    publication_year:
      type: int
      required: true
    version:
      type: float
    was_generated_by:
      # exactly one profile must be chosen; profile_type is the discriminator
      type: polymorphic
      discriminator: profile_type
      required: true
      oneof:
        - discriminator: rawData
          type: CZBIRDRawDataProfile
        - discriminator: processedData
          type: CZBIRDProcessedDataProfile
        - discriminator: analysedData
          type: CZBIRDAnalysedDataProfile
        - discriminator: generalRecord
          type: CZBIRDGeneralRecordProfile
