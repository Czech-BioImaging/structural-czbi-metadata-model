# CzBIRD metadata field definitions
# Included by czbird.yaml under record.properties.metadata.properties via:
#   use: [./czbird-metadata.yaml]
# Type definitions live in czbird-definitions.yaml.

record_title:
  type: fulltext+keyword
  required: true

additional_note:
  type: array
  items:
    type: fulltext

publication_year:
  type: int
  required: true

version:
  type: float

was_generated_by:
  # exactly one profile must be chosen; profile_type is the discriminator
  type: polymorphic
  discriminator: profile_type
  required: true
  oneof:
    - discriminator: rawData
      use: ./czbird-definitions.yaml#/CZBIRDRawDataProfile
    - discriminator: processedData
      use: ./czbird-definitions.yaml#/CZBIRDProcessedDataProfile
    - discriminator: analysedData
      use: ./czbird-definitions.yaml#/CZBIRDAnalysedDataProfile
    - discriminator: generalRecord
      use: ./czbird-definitions.yaml#/CZBIRDGeneralRecordProfile
